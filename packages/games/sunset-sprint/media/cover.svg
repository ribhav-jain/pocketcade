<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E2A84"/>
      <stop offset="0.38" stop-color="#9A3FA0"/>
      <stop offset="0.66" stop-color="#F0608C"/>
      <stop offset="0.85" stop-color="#FF9E6B"/>
      <stop offset="1" stop-color="#FFD08A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE38A" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFE38A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4B8"/>
      <stop offset="0.6" stop-color="#FFC65A"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C76A9E"/>
      <stop offset="1" stop-color="#7E4C9E"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C38A"/>
      <stop offset="1" stop-color="#EBC07B"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C98AA0"/>
      <stop offset="0.35" stop-color="#7A6E92"/>
      <stop offset="1" stop-color="#5E5878"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4F78B"/>
      <stop offset="0.55" stop-color="#B8F34A"/>
      <stop offset="1" stop-color="#7FAA34"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.38" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#F07A45"/>
      <stop offset="1" stop-color="#D9572B"/>
    </radialGradient>
    <radialGradient id="tail" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF3A4A" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF3A4A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky, sun and clouds -->
  <rect width="600" height="340" fill="url(#sky)"/>
  <circle cx="300" cy="215" r="230" fill="url(#glow)"/>
  <circle cx="300" cy="215" r="104" fill="url(#sun)"/>
  <g fill="#FFB4C8" opacity="0.45">
    <rect x="40" y="96" width="190" height="10" rx="5"/>
    <rect x="400" y="70" width="170" height="10" rx="5"/>
    <rect x="430" y="150" width="120" height="8" rx="4"/>
    <rect x="70" y="170" width="110" height="8" rx="4"/>
  </g>

  <!-- distant headlands and the sea -->
  <path d="M-10 332 C40 296 110 296 170 332 Z M380 332 C440 300 520 292 610 318 L610 332 Z" fill="#8E5AA6"/>
  <rect y="330" width="600" height="40" fill="url(#sea)"/>
  <g fill="#FFDCC8" opacity="0.6">
    <rect x="250" y="338" width="60" height="2"/>
    <rect x="290" y="346" width="40" height="2"/>
    <rect x="262" y="354" width="70" height="2"/>
    <rect x="60" y="342" width="30" height="2"/>
    <rect x="480" y="350" width="34" height="2"/>
  </g>

  <!-- near green headlands -->
  <path d="M-20 372 C30 320 110 318 190 372 Z" fill="#2F7A74"/>
  <path d="M430 372 C480 314 560 306 620 340 L620 372 Z" fill="#2F7A74"/>
  <path d="M480 372 C510 340 560 336 600 352 L600 372 Z" fill="#3C9483"/>

  <!-- sand and the road bending right -->
  <rect y="366" width="600" height="234" fill="url(#sand)"/>
  <path d="M-140 600 Q200 430 318 368 L338 368 Q420 440 740 600 Z" fill="#FFF6EA"/>
  <path d="M-140 600 Q200 430 318 368 L338 368 Q420 440 740 600 Z" fill="none" stroke="#FF5A5F" stroke-width="16" stroke-dasharray="26 22"/>
  <path d="M-80 600 Q210 432 321 368 L335 368 Q412 440 680 600 Z" fill="url(#road)"/>
  <g fill="none" stroke="#FFF6EA" stroke-linecap="round">
    <path d="M170 600 Q262 430 325 369" stroke-width="7" stroke-dasharray="40 34"/>
    <path d="M430 600 Q370 430 331 369" stroke-width="7" stroke-dasharray="40 34"/>
  </g>

  <!-- palms -->
  <g stroke="#2B1638" stroke-width="3" stroke-linejoin="round">
    <path d="M70 470 Q90 360 70 250 L84 250 Q106 360 86 470 Z" fill="#B5793F"/>
    <g fill="#2BD47D">
      <path d="M77 252 Q20 216 -10 262 Q34 234 77 262 Z"/>
      <path d="M77 252 Q44 192 0 196 Q54 210 77 260 Z"/>
      <path d="M77 252 Q104 190 150 196 Q104 214 79 260 Z"/>
      <path d="M77 252 Q142 222 168 268 Q122 238 79 262 Z"/>
      <path d="M77 252 Q80 196 60 176 Q96 196 82 256 Z" fill="#1FAE6A"/>
    </g>
    <circle cx="72" cy="262" r="7" fill="#7A4A26"/>
    <circle cx="86" cy="264" r="7" fill="#7A4A26"/>
    <path d="M520 420 Q534 350 518 290 L528 290 Q546 350 532 420 Z" fill="#B5793F"/>
    <g fill="#2BD47D">
      <path d="M523 292 Q480 266 456 300 Q490 280 523 300 Z"/>
      <path d="M523 292 Q500 248 466 250 Q508 262 523 298 Z" fill="#1FAE6A"/>
      <path d="M523 292 Q548 250 584 256 Q546 268 525 298 Z"/>
      <path d="M523 292 Q570 274 590 306 Q556 288 525 300 Z" fill="#1FAE6A"/>
    </g>
  </g>

  <!-- Miso's lime convertible -->
  <ellipse cx="300" cy="586" rx="170" ry="16" fill="#1E0A28" opacity="0.3"/>
  <g stroke="#2B1638" stroke-linejoin="round">
    <rect x="148" y="520" width="50" height="58" rx="12" fill="#1E1A30" stroke="none"/>
    <rect x="402" y="520" width="50" height="58" rx="12" fill="#1E1A30" stroke="none"/>
    <rect x="196" y="438" width="80" height="62" rx="20" fill="#E8475A" stroke-width="4"/>
    <rect x="324" y="438" width="80" height="62" rx="20" fill="#E8475A" stroke-width="4"/>
  </g>

  <!-- Miso: turned to look back with a grin -->
  <g stroke="#2B1638" stroke-linejoin="round">
    <path d="M232 400 Q240 352 270 362 Q276 384 262 404 Z" fill="#FFF3E6" stroke-width="4"/>
    <path d="M244 396 Q248 370 266 372 Q268 388 258 400 Z" fill="#5A2A28" stroke="none"/>
    <path d="M368 400 Q360 352 330 362 Q324 384 338 404 Z" fill="#FFF3E6" stroke-width="4"/>
    <path d="M356 396 Q352 370 334 372 Q332 388 342 400 Z" fill="#5A2A28" stroke="none"/>
    <ellipse cx="300" cy="430" rx="64" ry="56" fill="url(#fur)" stroke-width="5"/>
    <path d="M250 470 Q300 494 350 470 L354 490 Q300 512 246 490 Z" fill="#FF4FA3" stroke-width="4"/>
    <path d="M336 486 Q384 484 396 456 L380 498 Z" fill="#FF9F1C" stroke-width="3"/>
  </g>
  <g fill="#FFF3E6">
    <ellipse cx="300" cy="452" rx="34" ry="24"/>
    <ellipse cx="274" cy="402" rx="12" ry="7" transform="rotate(-17 274 402)"/>
    <ellipse cx="326" cy="402" rx="12" ry="7" transform="rotate(17 326 402)"/>
    <ellipse cx="250" cy="444" rx="15" ry="19"/>
    <ellipse cx="350" cy="444" rx="15" ry="19"/>
  </g>
  <ellipse cx="300" cy="440" rx="10" ry="7" fill="#2B1638"/>
  <g fill="none" stroke="#2B1638" stroke-width="5" stroke-linecap="round">
    <path d="M262 428 A11 11 0 0 1 284 428"/>
    <path d="M316 428 A11 11 0 0 1 338 428"/>
  </g>
  <path d="M284 452 Q300 476 316 452 Z" fill="#C2304A" stroke="#2B1638" stroke-width="4" stroke-linejoin="round"/>

  <g stroke="#2B1638" stroke-linejoin="round">
    <!-- body -->
    <path d="M136 556 Q132 496 176 488 L424 488 Q468 496 464 556 L458 578 Q300 594 142 578 Z" fill="url(#lime)" stroke-width="5"/>
    <rect x="176" y="496" width="248" height="11" rx="5" fill="#FFFFFF" opacity="0.35" stroke="none"/>
    <path d="M196 520 Q300 530 404 520" fill="none" stroke="#5E7E22" stroke-width="3"/>
    <!-- ringed tail over the back -->
    <path d="M366 490 C420 490 434 540 414 584 C404 594 384 590 388 576 C402 544 392 512 360 510 Z" fill="#D9572B" stroke-width="4"/>
    <path d="M372 512 L404 512 L406 524 L380 522 Z M388 548 L412 546 L412 558 L390 560 Z" fill="#F2C49A" stroke="none"/>
    <!-- lights, plate, bumper -->
    <circle cx="176" cy="542" r="24" fill="url(#tail)" stroke="none"/>
    <circle cx="424" cy="542" r="24" fill="url(#tail)" stroke="none"/>
    <circle cx="170" cy="542" r="11" fill="#FF4A5A" stroke-width="3"/>
    <circle cx="198" cy="542" r="11" fill="#FF4A5A" stroke-width="3"/>
    <circle cx="402" cy="542" r="11" fill="#FF4A5A" stroke-width="3"/>
    <circle cx="430" cy="542" r="11" fill="#FF4A5A" stroke-width="3"/>
    <rect x="266" y="540" width="68" height="22" rx="5" fill="#FFF6EA" stroke-width="3"/>
    <path d="M300 543 L303 549 L310 550 L305 554 L306 560 L300 557 L294 560 L295 554 L290 550 L297 549 Z" fill="#FF7A59" stroke="none"/>
    <rect x="150" y="568" width="300" height="16" rx="8" fill="#E4E0F4" stroke-width="3"/>
  </g>

  <!-- speed streaks -->
  <g stroke="#FFFFFF" stroke-linecap="round" opacity="0.5">
    <path d="M40 420 L-10 450" stroke-width="4"/>
    <path d="M30 520 L-20 560" stroke-width="4"/>
    <path d="M560 430 L610 458" stroke-width="4"/>
    <path d="M570 520 L620 556" stroke-width="4"/>
  </g>
</svg>
