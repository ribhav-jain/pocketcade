    <circle cx="70" cy="84" r="60" fill="url(#hS)"/>
    <path d="M70 52l28 16v32l-28 16-28-16V68z" fill="#A8EEFF" filter="url(#soft)"/>
    <path d="M70 52l28 16v32l-28 16-28-16V68z" fill="url(#fS)" stroke="#140E36" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="70" cy="84" r="9.5" fill="none" stroke="#140E36" stroke-width="4.5"/>
  </g>
  <g transform="translate(222 410) scale(1.11)" filter="url(#shadow)">
    <use xlink:href="#jar"/>
    <circle cx="70" cy="84" r="62" fill="url(#hO)"/>
    <circle cx="70" cy="84" r="28" fill="#FFD58C" filter="url(#soft)"/>
    <circle cx="70" cy="84" r="26" fill="url(#fO)" stroke="#140E36" stroke-width="4"/>
    <ellipse cx="61" cy="72" rx="9" ry="5" fill="#fff" fill-opacity=".55" transform="rotate(-28 61 72)"/>
    <rect x="58" y="81" width="24" height="7" rx="3" fill="#140E36"/>
    <rect x="66.5" y="72" width="7" height="24" rx="3" fill="#140E36"/>
  </g>

  <!-- front grass -->
  <path d="M0 560C120 552 240 566 360 556S540 550 600 556V600H0Z" fill="#0D0A28"/>
  <g fill="#0D0A28">
    <path d="M10 560q4-40 10-56q2 30 4 56z"/><path d="M40 562q8-34 2-60q10 26 12 60z"/><path d="M196 566q6-26 14-38q-2 20 2 38z"/>
    <path d="M300 562q4-30 -6-48q14 18 14 48z"/><path d="M402 566q2-26 12-36q-2 22 0 36z"/><path d="M552 560q-6-40 4-64q2 36 8 64z"/>
    <path d="M580 562q6-30 0-50q10 22 10 50z"/><path d="M130 564q-4-24 6-38q0 22 4 38z"/>
  </g>

  <!-- sparkle trail from the jars -->
  <g fill="#FFF6B0">
    <path d="M300 352l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <path d="M236 380l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
    <path d="M372 372l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
  </g>

  <!-- fireflies -->
  <g>
    <circle cx="92" cy="300" r="16" fill="url(#glow)"/><circle cx="168" cy="236" r="10" fill="url(#lime)"/>
    <circle cx="514" cy="300" r="15" fill="url(#glow)"/><circle cx="440" cy="232" r="9" fill="url(#glow)"/>
    <circle cx="560" cy="380" r="11" fill="url(#lime)"/><circle cx="40" cy="380" r="10" fill="url(#glow)"/>
    <circle cx="210" cy="340" r="8" fill="url(#glow)"/><circle cx="400" cy="330" r="9" fill="url(#lime)"/>
    <circle cx="140" cy="120" r="8" fill="url(#glow)"/><circle cx="260" cy="520" r="9" fill="url(#glow)"/>
  </g>

  <!-- Lumi -->
  <g transform="translate(300 214)">
    <circle cx="0" cy="40" r="190" fill="url(#aura)"/>
    <circle cx="0" cy="76" r="96" fill="url(#glow)"/>
    <g fill="url(#wing)" stroke="#fff" stroke-width="4">
      <ellipse cx="-74" cy="-74" rx="62" ry="32" transform="rotate(32 -74 -74)"/>
      <ellipse cx="74" cy="-74" rx="62" ry="32" transform="rotate(-32 74 -74)"/>
    </g>
    <g stroke="#fff" stroke-opacity=".6" stroke-width="2.5" fill="none">
      <path d="M-30 -46q-40 -12 -86 -48"/><path d="M30 -46q40 -12 86 -48"/>
