  <rect y="250" width="600" height="350" fill="url(#horizon)"/>
  <g fill="#fff">
    <circle cx="40" cy="40" r="1.6"/><circle cx="96" cy="88" r="1.2"/><circle cx="150" cy="30" r="2"/><circle cx="210" cy="70" r="1.3"/>
    <circle cx="60" cy="150" r="1.8"/><circle cx="130" cy="200" r="1.1"/><circle cx="250" cy="24" r="1.5"/><circle cx="340" cy="44" r="1.2"/>
    <circle cx="380" cy="96" r="1.8"/><circle cx="560" cy="40" r="1.4"/><circle cx="580" cy="190" r="1.7"/><circle cx="30" cy="250" r="1.3"/>
    <circle cx="520" cy="250" r="1.2"/><circle cx="420" cy="20" r="1.1"/><circle cx="180" cy="130" r="1"/><circle cx="560" cy="300" r="1.4"/>
  </g>
  <circle cx="500" cy="104" r="170" fill="url(#moonHalo)"/>
  <circle cx="500" cy="104" r="56" fill="url(#moon)"/>
  <g fill="#C4AA78" fill-opacity=".32">
    <circle cx="482" cy="94" r="11"/><circle cx="518" cy="120" r="8"/><circle cx="512" cy="80" r="6"/><circle cx="492" cy="128" r="5"/>
  </g>

  <!-- hills and meadow -->
  <path d="M0 430C70 410 130 400 200 414S330 446 400 424 520 392 600 410V600H0Z" fill="#2A2470"/>
  <path d="M0 482C90 466 170 470 250 486S420 500 500 478 570 466 600 470V600H0Z" fill="#1B1850"/>
  <g stroke="#120F38" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M36 600Q40 520 30 450"/><path d="M78 600Q74 530 88 480"/><path d="M560 600Q556 520 572 446"/><path d="M520 600Q528 540 510 496"/>
  </g>
  <g fill="#B9A8FF" fill-opacity=".6">
    <circle cx="30" cy="444" r="6"/><circle cx="572" cy="440" r="6"/>
  </g>
  <g fill="#FF9FD0" fill-opacity=".55"><circle cx="88" cy="476" r="7"/><circle cx="510" cy="492" r="6"/></g>
  <g fill="#FFE14D"><circle cx="30" cy="444" r="2.5"/><circle cx="572" cy="440" r="2.5"/><circle cx="88" cy="476" r="2.5"/><circle cx="510" cy="492" r="2.2"/></g>

  <!-- the jars -->
  <ellipse cx="110" cy="478" rx="120" ry="110" fill="url(#aura)"/>
  <ellipse cx="490" cy="478" rx="120" ry="110" fill="url(#aura)"/>
  <ellipse cx="300" cy="500" rx="140" ry="120" fill="url(#aura)"/>
  <g transform="translate(40 392) rotate(-8 70 70)" filter="url(#shadow)">
    <use xlink:href="#jar"/>
    <circle cx="70" cy="84" r="60" fill="url(#hG)"/>
    <path d="M70 58l26 19-10 30H54l-10-30z" fill="#9AF0C4" filter="url(#soft)"/>
    <path d="M70 58l26 19-10 30H54l-10-30z" fill="url(#fG)" stroke="#140E36" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="70" cy="84" r="7.5" fill="#140E36"/>
  </g>
  <g transform="translate(420 392) rotate(8 70 70)" filter="url(#shadow)">
