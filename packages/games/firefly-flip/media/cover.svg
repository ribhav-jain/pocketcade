<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0724"/>
      <stop offset=".35" stop-color="#1A1452"/>
      <stop offset=".7" stop-color="#2E2C7C"/>
      <stop offset="1" stop-color="#3E4C98"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".2" stop-color="#FFF6A0" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#FFE14D" stop-opacity=".25"/>
      <stop offset="1" stop-color="#FFE14D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE14D" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#FFD23D" stop-opacity=".3"/>
      <stop offset="1" stop-color="#FFC83D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lime" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".25" stop-color="#D8FF8A" stop-opacity=".8"/>
      <stop offset="1" stop-color="#B8F34A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonHalo" cx=".5" cy=".5" r=".5">
      <stop offset=".3" stop-color="#E2E6FF" stop-opacity=".4"/>
      <stop offset="1" stop-color="#E2E6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#FFFEF4"/>
      <stop offset=".7" stop-color="#F7EDCB"/>
      <stop offset="1" stop-color="#E4D3A4"/>
    </radialGradient>
    <radialGradient id="horizon" cx=".5" cy="1" r=".75">
      <stop offset="0" stop-color="#8B6CFF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8B6CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx=".36" cy=".3" r=".75">
      <stop offset="0" stop-color="#D3CBFF"/>
      <stop offset=".5" stop-color="#8C78FF"/>
      <stop offset="1" stop-color="#5642C8"/>
    </radialGradient>
    <radialGradient id="tail" cx=".5" cy=".62" r=".6">
      <stop offset="0" stop-color="#FFFFF4"/>
      <stop offset=".5" stop-color="#FFF07A"/>
      <stop offset="1" stop-color="#FFC21A"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4F2FF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#E4DCFF" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A4FD4"/>
      <stop offset="1" stop-color="#231B6A"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE48A"/>
      <stop offset="1" stop-color="#E9A825"/>
    </linearGradient>
    <radialGradient id="hG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5BF0A0"/><stop offset=".5" stop-color="#2BD47D" stop-opacity=".75"/><stop offset="1" stop-color="#2BD47D" stop-opacity="0"/></radialGradient>
    <radialGradient id="hO" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFC060"/><stop offset=".5" stop-color="#FF9F1C" stop-opacity=".75"/><stop offset="1" stop-color="#FF9F1C" stop-opacity="0"/></radialGradient>
    <radialGradient id="hS" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7AE6FF"/><stop offset=".5" stop-color="#38D6FF" stop-opacity=".75"/><stop offset="1" stop-color="#38D6FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="fG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9AF0C4"/><stop offset="1" stop-color="#22B86A"/></linearGradient>
    <linearGradient id="fO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD58C"/><stop offset="1" stop-color="#F08A00"/></linearGradient>
    <linearGradient id="fS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A8EEFF"/><stop offset="1" stop-color="#1FB8E8"/></linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#04020F" flood-opacity=".55"/></filter>
    <!-- a glass jar, 140 × 140 -->
    <g id="jar">
      <rect x="6" y="22" width="128" height="112" rx="30" fill="url(#glass)" stroke="#140E36" stroke-width="4"/>
      <rect x="11.5" y="27.5" width="117" height="101" rx="25" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.6"/>
      <rect x="16" y="36" width="9" height="58" rx="4.5" fill="#fff" fill-opacity=".32"/>
      <rect x="16" y="100" width="9" height="12" rx="4.5" fill="#fff" fill-opacity=".32"/>
      <rect x="108" y="36" width="7" height="26" rx="3.5" fill="#fff" fill-opacity=".18"/>
      <rect x="30" y="15" width="80" height="10" fill="#2C3488" stroke="#140E36" stroke-width="2.5"/>
      <rect x="22" y="3" width="96" height="21" rx="8" fill="url(#lid)" stroke="#140E36" stroke-width="2.5"/>
      <path d="M34 8v10M46 8v10M58 8v10M70 8v10M82 8v10M94 8v10M106 8v10" stroke="#140E36" stroke-opacity=".25" stroke-width="2.5"/>
    </g>
