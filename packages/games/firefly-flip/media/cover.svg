    <g stroke="#6A58CC" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M-18 -62q-6 -34 -44 -46"/><path d="M18 -62q6 -34 44 -46"/>
    </g>
    <circle cx="-64" cy="-108" r="22" fill="url(#glow)"/><circle cx="64" cy="-108" r="22" fill="url(#glow)"/>
    <circle cx="-64" cy="-108" r="9" fill="#FFF07A" stroke="#E09A00" stroke-width="2"/>
    <circle cx="64" cy="-108" r="9" fill="#FFF07A" stroke="#E09A00" stroke-width="2"/>
    <ellipse cx="0" cy="68" rx="50" ry="44" fill="url(#tail)" stroke="#E09A00" stroke-width="4"/>
    <path d="M-40 76q40 22 80 0" fill="none" stroke="#D99A00" stroke-opacity=".5" stroke-width="4"/>
    <circle cx="0" cy="0" r="74" fill="url(#body)" stroke="#140E36" stroke-width="6"/>
    <ellipse cx="0" cy="10" rx="58" ry="42" fill="#E9E3FF" fill-opacity=".45"/>
    <ellipse cx="-30" cy="-44" rx="20" ry="11" fill="#fff" fill-opacity=".7" transform="rotate(-30 -30 -44)"/>
    <g fill="#FF4FA3" fill-opacity=".6"><ellipse cx="-48" cy="24" rx="13" ry="8"/><ellipse cx="48" cy="24" rx="13" ry="8"/></g>
    <g stroke="#140E36" stroke-width="4.5">
      <ellipse cx="-26" cy="-4" rx="21" ry="25" fill="#fff"/><ellipse cx="26" cy="-4" rx="21" ry="25" fill="#fff"/>
    </g>
    <g fill="#140E36"><circle cx="-24" cy="0" r="14"/><circle cx="28" cy="0" r="14"/></g>
    <g fill="#fff"><circle cx="-29" cy="-7" r="5.5"/><circle cx="23" cy="-7" r="5.5"/><circle cx="-19" cy="6" r="2.5"/><circle cx="33" cy="6" r="2.5"/></g>
    <path d="M-20 26q20 32 40 0z" fill="#4A1030" stroke="#140E36" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="0" cy="40" rx="9" ry="5" fill="#FF4FA3"/>
  </g>
</svg>
