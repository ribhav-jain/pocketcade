# Every pnpm setting lives here; there is no .npmrc.
packages:
  - apps/*
  - packages/*
  - packages/games/*

# Versions shared by several packages, referenced with "catalog:".
catalog:
  '@fontsource-variable/fredoka': 5.3.0
  '@fontsource-variable/nunito': 5.3.0
  '@playwright/test': 1.65.0
  '@types/node': 26.6.6
  '@vitest/browser-playwright': 5.1.0
  eslint: 10.14.0
  phaser: 4.2.1
  playwright: 1.65.0
  prettier: 3.9.10
  typescript: 7.0.2
  vite: 8.3.6
  vitest: 5.1.0

# `pnpm add` saves exact versions, so an upgrade is always a deliberate change.
savePrefix: ''

# pnpm does not install versions published less than a day ago (its default minimumReleaseAge). Strict mode
# makes a too-new version fail the install instead of being skipped silently.
minimumReleaseAgeStrict: true

# Run package scripts with pnpm's cross-platform shell, so `VAR=1 cmd` works on Windows too.
shellEmulator: true
